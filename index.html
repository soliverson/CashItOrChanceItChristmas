<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
  Cash It or Chance It | Christmas Edition | Made2PlayGames
  </title>

  <meta
    name="description"
    content="Cash It or Chance It - Christmas Edition. A personalized interactive holiday party game by Made2PlayGames."
  >

  <link
    rel="icon"
    href="images/favicon.ico"
    type="image/x-icon"
  >

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body class="birthday-40-edition">


  <!-- =====================================================
       INTRO VIDEO
  ====================================================== -->

  <div id="introVideoContainer">

    <video
      id="introVideo"
      playsinline
    >

      <source
        src="videos/intro.mp4"
        type="video/mp4"
      >

      Your browser does not support the video tag.

    </video>


    <div id="introButtons">

      <button id="introPlayButton">
        Play Intro
      </button>

      <button id="introFullScreenButton">
        Full Screen
      </button>

      <button id="skipIntroButton">
        Skip Intro
      </button>

    </div>

  </div>



  <!-- =====================================================
       LOADING
  ====================================================== -->

  <div id="loadingOverlay">
    Loading...
  </div>



  <!-- =====================================================
       40TH BIRTHDAY TOP SCENERY
  ====================================================== -->

  <div
    class="birthday-scenery birthday-top-scenery"
  ></div>



  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header>

    <div id="headerContent">


      <!-- LEFT MESSAGE -->

      <div
        class="
          birthday-header-message
          birthday-message-left
        "
      >

        CHRISTMAS<br>
        GAME NIGHT!

      </div>

<!-- MAIN TITLE -->

      <div id="headerTitles">

        <h1 class="game-title">

          CASH IT

          <span class="title-or">
            OR
          </span>

          CHANCE IT

        </h1>


        <div class="birthday-subtitle">

          Christmas Edition

        </div>

      </div>



      <!-- RIGHT MESSAGE -->

      <div
        class="
          birthday-header-message
          birthday-message-right
        "
      >

        MERRY &<br>
        BRIGHT!

      </div>



      <!-- HEADER BUTTONS -->

      <div id="headerButtons">


        <!--
            IMPORTANT:
            This starts as "Full Screen".

            screen.js will automatically change it
            to "Exit Full Screen" when fullscreen
            is actually active.
        -->

        <button
          id="fullScreenBtn"
          type="button"
          onclick="toggleFullScreen()"
        >
          Full Screen
        </button>


        <button
          id="watchIntroBtn"
          type="button"
        >
          Watch Intro Again
        </button>


        <button
          id="musicToggleBtn"
          type="button"
        >
          🔊 Music<br>On
        </button>


      </div>

    </div>

  </header>



  <!-- =====================================================
       MAIN GAME AREA
  ====================================================== -->

  <main>


    <!-- PHOTO GAME BOARD -->

    <section id="briefcasesSection">


      <!-- PHOTOS ARE GENERATED BY JAVASCRIPT -->

      <div id="briefcasesContainer"></div>



      <!-- GAME INSTRUCTIONS -->

      <div id="briefcasesInfo">

        <p id="gameMessage">

          Choose your personal pick.

        </p>

      </div>


    </section>



    <!-- =================================================
         PRIZE BOARD
    ================================================== -->

    <aside id="prizesSection">


      <h2>
        PRIZES
      </h2>


      <ul id="prizeBoard"></ul>



      <div class="prize-divider"></div>



      <h2>
        PREVIOUS OFFERS
      </h2>


      <ul id="offersHistory"></ul>


    </aside>


  </main>



  <!-- =====================================================
       BOTTOM BIRTHDAY MESSAGE
  ====================================================== -->

  <div class="birthday-bottom-area">


    <!-- LEFT MESSAGE -->

    <div
      class="
        birthday-bottom-message
        birthday-bottom-left
      "
    >

      GOOD TIMES.<br>
      GREAT MEMORIES!

    </div>



    <!-- CENTER MESSAGE -->

    <div class="birthday-cheers">

      <span class="birthday-sparkle">
        ✦
      </span>

      <span class="birthday-heart">
        ♥
      </span>

      <span>
        Merry Christmas!
      </span>

      <span class="birthday-heart">
        ♥
      </span>

      <span class="birthday-sparkle">
        ✦
      </span>

    </div>



    <!-- RIGHT MESSAGE -->

    <div
      class="
        birthday-bottom-message
        birthday-bottom-right
      "
    >

      LET THE<br>
      FUN BEGIN!

    </div>


  </div>



  <!-- =====================================================
       BOTTOM SCENERY
  ====================================================== -->

  <div
    class="birthday-scenery birthday-bottom-scenery"
  ></div>



  <!-- =====================================================
       FIREWORKS
  ====================================================== -->

  <div id="fireworksContainer"></div>



  <!-- =====================================================
       SOUND EFFECTS
  ====================================================== -->

  <audio
    id="clickSound"
    src="audio/click.mp3"
    preload="auto"
  ></audio>


  <audio
    id="offerSound"
    src="audio/offer.mp3"
    preload="auto"
  ></audio>


  <audio
    id="declineSound"
    src="audio/decline.mp3"
    preload="auto"
  ></audio>


  <audio
    id="applause"
    src="audio/applause.mp3"
    preload="auto"
  ></audio>


  <audio
    id="suspenseMusic"
    src="audio/jaws.mp3"
    preload="auto"
  ></audio>


  <audio
    id="finalSwapMusic"
    src="audio/finalswap.mp3"
    preload="auto"
  ></audio>



  <!-- =====================================================
       BACKGROUND MUSIC
  ====================================================== -->

  <audio
    id="backgroundMusic"
    src="audio/quiz-master.mp3"
    preload="auto"
    loop
  ></audio>



  <!-- =====================================================
       OFFER MODAL
  ====================================================== -->

  <div
    id="offerModal"
    class="modal"
  >

    <div class="modal-content">

      <div id="offerDetails"></div>

    </div>

  </div>



  <!-- =====================================================
       GAME SCRIPTS
  ====================================================== -->

  <script
    defer
    src="scripts/data.js"
  ></script>

  <script
    defer
    src="scripts/render.js"
  ></script>

  <script
    defer
    src="scripts/sounds.js"
  ></script>

  <script
    defer
    src="scripts/game.js"
  ></script>

  <script
    defer
    src="scripts/effects.js"
  ></script>

  <script
    defer
    src="scripts/screen.js"
  ></script>

  <script
    defer
    src="scripts/intro.js"
  ></script>



  <!-- =====================================================
       BACKGROUND MUSIC CONTROL
  ====================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {


        const backgroundMusic =
          document.getElementById(
            "backgroundMusic"
          );


        const musicToggleBtn =
          document.getElementById(
            "musicToggleBtn"
          );


        const introVideo =
          document.getElementById(
            "introVideo"
          );


        const skipIntroButton =
          document.getElementById(
            "skipIntroButton"
          );


        const watchIntroBtn =
          document.getElementById(
            "watchIntroBtn"
          );


        let musicEnabled = true;



        /* =========================================
           MUSIC SETTINGS
        ========================================== */

        backgroundMusic.volume = 0.12;



        /* =========================================
           START MUSIC
        ========================================== */

        function startBackgroundMusic() {

          if (!musicEnabled) {
            return;
          }


          backgroundMusic
            .play()
            .catch(() => {

              /*
                  Browser autoplay protection may
                  prevent music until the player
                  interacts with the page.
              */

            });

        }



        /* =========================================
           STOP MUSIC
        ========================================== */

        function stopBackgroundMusic() {

          backgroundMusic.pause();

        }



        /* =========================================
           UPDATE MUSIC BUTTON
        ========================================== */

        function updateMusicButton() {

          if (musicEnabled) {

            musicToggleBtn.innerHTML =
              "🔊 Music<br>On";

          } else {

            musicToggleBtn.innerHTML =
              "🔇 Music<br>Off";

          }

        }



        /* =========================================
           MUSIC BUTTON
        ========================================== */

        musicToggleBtn.addEventListener(
          "click",
          function () {

            musicEnabled =
              !musicEnabled;


            if (musicEnabled) {

              startBackgroundMusic();

            } else {

              stopBackgroundMusic();

            }


            updateMusicButton();

          }
        );



        /* =========================================
           INTRO FINISHES
        ========================================== */

        if (introVideo) {

          introVideo.addEventListener(
            "ended",
            function () {

              startBackgroundMusic();

            }
          );

        }



        /* =========================================
           SKIP INTRO
        ========================================== */

        if (skipIntroButton) {

          skipIntroButton.addEventListener(
            "click",
            function () {

              setTimeout(
                startBackgroundMusic,
                250
              );

            }
          );

        }



        /* =========================================
           WATCH INTRO AGAIN
        ========================================== */

        if (watchIntroBtn) {

          watchIntroBtn.addEventListener(
            "click",
            function () {

              stopBackgroundMusic();

            }
          );

        }



        /* =========================================
           AUTOPLAY FALLBACK

           Start background music after the
           player's first interaction with the
           game if autoplay was blocked.
        ========================================== */

        document.addEventListener(
          "click",
          function startMusicAfterInteraction(
            event
          ) {

            if (
              event.target.closest(
                "#introVideoContainer"
              )
            ) {

              return;

            }


            startBackgroundMusic();


            document.removeEventListener(
              "click",
              startMusicAfterInteraction
            );

          }
        );


        updateMusicButton();

      }
    );

  </script>



  <!-- =====================================================
       GAME INITIALIZATION
  ====================================================== -->

  <script>

    window.addEventListener(
      "load",
      function () {


        /* -----------------------------------------
           REMOVE LOADING SCREEN
        ------------------------------------------ */

        const loadingOverlay =
          document.getElementById(
            "loadingOverlay"
          );


        if (loadingOverlay) {

          loadingOverlay.style.display =
            "none";

        }



        /* -----------------------------------------
           RENDER PHOTOS
        ------------------------------------------ */

        if (
          typeof renderBriefcases ===
          "function"
        ) {

          renderBriefcases();

        }



        /* -----------------------------------------
           UPDATE PRIZE / OFFER PANELS
        ------------------------------------------ */

        if (
          typeof updateSidePanels ===
          "function"
        ) {

          updateSidePanels();

        }



        /* -----------------------------------------
           SHOW FIRST ROUND
        ------------------------------------------ */

        if (
          typeof showRoundModal ===
          "function"
        ) {

          showRoundModal(1);

        }

      }
    );

  </script>


</body>

</html>
